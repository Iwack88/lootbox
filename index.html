<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1a2e">
<title>Lootbox Packer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <span>💰 <b id="gold">0</b></span>
  <span>⭐ EXP <b id="exp">0</b></span>
</header>

<details class="card" id="queueCard" open>
  <summary>Kunden <small id="queueInfo"></small><span class="auto" id="autoToggle"></span></summary>
  <div id="queue" class="queue"></div>
</details>

<details class="card" id="custCard" open>
  <summary>Aktiver Kunde</summary>
  <div id="customer"></div>
</details>

<details class="card" id="pickCard" open>
  <summary>Box wählen <small id="pickInfo"></small></summary>
  <div id="boxPicker" class="picker"></div>
</details>

<details class="card" id="boxCard" open>
  <summary>Box <small id="slotInfo"></small></summary>
  <div class="bar weight"><div id="weightBar"></div></div>
  <div id="box" class="box"></div>
  <div id="preview" class="preview"></div>
</details>

<details class="card" id="shopCard" open>
  <summary>Shop</summary>
  <div id="shop" class="shop"></div>
</details>

<button id="send" class="primary fab">📦 Absenden</button>

<div id="result" class="overlay hidden"></div>
<script src="game.js"></script>
</body>
</html>
