<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1a2e">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Lootbox Packer</title>
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<header>
  <span>💰 <b id="gold">0</b></span>
  <span>⭐ EXP <b id="exp">0</b></span>
</header>

<div class="merchant-status">
  <span id="merchantStatus"></span>
  <progress id="merchantProgress" max="5" value="0" aria-label="Fortschritt bis zum Händler"></progress>
  <span id="debtInfo"></span>
</div>

<main class="game-layout">
<section class="panel-column" aria-label="Kundenliste">
<details class="card" id="queueCard" open>
  <summary>Kunden <small id="queueInfo"></small><span class="auto" id="autoToggle"></span></summary>
  <div id="queue" class="queue"></div>
</details>
</section>

<section class="panel-column" aria-label="Auftrag packen">
<details class="card" id="custCard" open>
  <summary>Aktiver Kunde</summary>
  <div id="customer"></div>
</details>

<details class="card" id="pickCard" open>
  <summary>Box wählen <small id="pickInfo"></small></summary>
  <div id="boxPicker" class="picker"></div>
</details>

<details class="card" id="boxCard" open>
  <summary>Box <small id="slotInfo"></small></summary>
  <div class="bar weight"><div id="weightBar"></div></div>
  <div id="box" class="box"></div>
  <div id="preview" class="preview"></div>
</details>
</section>

<section class="panel-column" aria-label="Vorräte">
<details class="card" id="inventoryCard" open>
  <summary>Inventar <small id="inventoryInfo"></small></summary>
  <p class="hint">Tippe auf ein Item, um es einzupacken. Entfernte Items gehen zurück ins Lager.</p>
  <div id="inventory" class="shop"></div>
  <div class="restock-panel">
    <button id="restock" class="primary">Notfall-Restock</button>
    <p id="restockHint" class="hint"></p>
    <div id="restockResult" role="status"></div>
  </div>
</details>
</section>

<section class="panel-column" aria-label="Händler">
<details class="card" id="shopCard" open>
  <summary>Shop</summary>
  <p id="shopHint" class="hint"></p>
  <div id="shop" class="shop"></div>
  <button id="finishShopping" class="primary">Einkauf beenden</button>
</details>
</section>
</main>

<button id="send" class="primary fab">📦 Absenden</button>

<div id="result" class="overlay hidden"></div>
<script src="game.js?v=8"></script>
</body>
</html>
